<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk File Converter - Pro Suite</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23080c16'/%3E%3Crect x='10' y='15' width='38' height='50' rx='6' fill='%23ff2a75'/%3E%3Ctext x='29' y='45' font-family='sans-serif' font-weight='900' font-size='14' fill='white' text-anchor='middle'%3EPDF%3C/text%3E%3Crect x='52' y='35' width='38' height='50' rx='6' fill='%2300f2fe'/%3E%3Ctext x='71' y='65' font-family='sans-serif' font-weight='900' font-size='14' fill='%23080c16' text-anchor='middle'%3EJPG%3C/text%3E%3Cpath d='M 40 40 L 60 40 L 52 32 M 60 40 L 52 48' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  
  <!-- PDF.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- FileSaver Library -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap');

    :root {
      --neon-pink: #ff2a75;
      --neon-cyan: #00f2fe;
      --btn-gradient: linear-gradient(135deg, #ff007f, #7928ca);
      --btn-success: linear-gradient(135deg, #00b09b, #96c93d);
      --btn-game: linear-gradient(135deg, #ffaa00, #ff0055);
      --glass-bg: rgba(8, 12, 22, 0.25);
      --glass-border: rgba(255, 255, 255, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.45) 100%),
                  url('https://wallpapercave.com/uwp/uwp5068026.jpeg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 950px;
      animation: fadeIn 0.8s ease-in-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
      z-index: 1;
    }

    .animated-title {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff, #00f2fe, #ff2a75, #ffaa00, #00f2fe, #ffffff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowGlow 4s ease infinite;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 25px rgba(0, 242, 254, 0.6));
      margin-bottom: 8px;
    }

    @keyframes rainbowGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header p {
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      background: rgba(0, 0, 0, 0.45);
      display: inline-block;
      padding: 6px 22px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Mode Selector Tabs */
    .mode-tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 12px 26px;
      border-radius: 30px;
      border: 1.5px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .tab-btn.active {
      background: var(--btn-gradient);
      border-color: transparent;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
    }

    .main-card {
      background: var(--glass-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1.5px solid var(--glass-border);
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                  inset 0 1px 1px rgba(255, 255, 255, 0.4);
      position: relative;
      z-index: 2;
    }

    .drop-zone {
      border: 2px dashed rgba(0, 242, 254, 0.7);
      border-radius: 20px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(0, 0, 0, 0.2);
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--neon-pink);
      background: rgba(255, 42, 117, 0.15);
      transform: scale(1.01);
      box-shadow: 0 0 25px rgba(255, 42, 117, 0.4);
    }

    .drop-zone-icon {
      font-size: 48px;
      margin-bottom: 10px;
      display: inline-block;
      animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .drop-zone-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      margin-bottom: 6px;
    }

    .drop-zone-subtitle {
      font-size: 0.95rem;
      color: #f1f5f9;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    input[type="file"] {
      display: none;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 34px;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--btn-gradient);
      color: white;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.9);
    }

    .btn-success {
      background: var(--btn-success);
      color: white;
      box-shadow: 0 0 20px rgba(0, 176, 155, 0.6);
    }

    .btn-success:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 35px rgba(0, 176, 155, 0.9);
    }

    .btn-game {
      background: var(--btn-game);
      color: white;
      box-shadow: 0 0 20px rgba(255, 170, 0, 0.6);
    }

    .btn-game:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 35px rgba(255, 170, 0, 0.9);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .progress-bar-container {
      margin-top: 35px;
      display: none;
    }

    .progress-track {
      width: 100%;
      height: 22px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 20px;
      position: relative;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f2fe, #ff2a75);
      border-radius: 20px;
      transition: width 0.2s ease;
      box-shadow: 0 0 15px #00f2fe;
      position: relative;
    }

    .runner-chase-group {
      position: absolute;
      right: -25px;
      top: -24px;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .mouse-runner {
      font-size: 28px;
      transform: scaleX(-1);
      animation: runVibe 0.15s infinite alternate;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
    }

    .cat-runner {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #00f2fe;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.9);
      animation: runVibe 0.15s infinite alternate-reverse;
    }

    @keyframes runVibe {
      0% { transform: translateY(0); }
      100% { transform: translateY(-4px); }
    }

    .status-text {
      text-align: center;
      margin-top: 18px;
      font-size: 1.1rem;
      color: #00f2fe;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
    }

    .thank-you-box {
      margin-top: 15px;
      background: linear-gradient(135deg, rgba(255, 42, 117, 0.3), rgba(0, 242, 254, 0.3));
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 12px 20px;
      border-radius: 15px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      display: none;
      animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popUp {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .output-section {
      margin-top: 35px;
      width: 100%;
    }

    .pdf-group {
      background: var(--glass-bg);
      backdrop-filter: blur(6px);
      border: 1.5px solid var(--glass-border);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .pdf-group-header {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 18px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    .page-card {
      background: rgba(10, 15, 28, 0.85);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.3s ease;
    }

    .page-card:hover {
      transform: translateY(-5px);
      border-color: #00f2fe;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
    }

    .page-card img {
      width: 100%;
      height: auto;
      display: block;
      background: #ffffff;
    }

    .page-info {
      padding: 12px;
      text-align: center;
    }

    .page-info span {
      font-size: 0.9rem;
      color: #ffffff;
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .dl-btn {
      display: inline-block;
      width: 100%;
      padding: 9px 0;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.25), rgba(255, 42, 117, 0.25));
      color: #ffffff;
      border: 1px solid rgba(0, 242, 254, 0.5);
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 800;
      transition: all 0.3s ease;
    }

    .dl-btn:hover {
      background: var(--btn-gradient);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.7);
    }

    .footer {
      margin-top: 35px;
      color: #ffffff;
      font-size: 0.95rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      font-weight: 700;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 24px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="animated-title">⚡ File Converter Pro</h1>
      <p>Multi-Format Conversion • Ultra HD Quality</p>
    </div>

    <!-- Mode Selector -->
    <div class="mode-tabs">
      <button class="tab-btn active" id="modePdfToJpgBtn" onclick="switchMode('pdf2jpg')">📄 PDF to JPG</button>
      <button class="tab-btn" id="modeImgToPdfBtn" onclick="switchMode('img2pdf')">🖼️ JPG / PNG to PDF</button>
    </div>

    <div class="main-card">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <span class="drop-zone-icon" id="dropIcon">🚀</span>
        <div class="drop-zone-title" id="dropTitle">Drag & Drop your PDFs here</div>
        <div class="drop-zone-subtitle">or click anywhere to browse from your device</div>
        <input type="file" id="fileInput" accept="application/pdf" multiple />
      </div>

      <div class="controls">
        <button id="convertBtn" class="btn btn-primary" onclick="startConversion()" disabled>
          ⚡ Convert Files
        </button>
        <button id="downloadZipBtn" class="btn btn-success" onclick="downloadMasterZip()" style="display: none;">
          📦 Download Master ZIP
        </button>
        <button id="downloadPdfBtn" class="btn btn-success" onclick="downloadSinglePdf()" style="display: none;">
          📄 Download Combined PDF
        </button>
        <a href="GAME.HTML" class="btn btn-game">
          🎮 Play Game
        </a>
      </div>

      <div class="progress-bar-container" id="progressContainer">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill">
            <div class="runner-chase-group">
              <span class="mouse-runner">🐭</span>
              <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQaGC2AN0T62Y4ID9LQqI5PzdVqG-LFA_bZmhbgt8KP-A&s=10" class="cat-runner" alt="Cat Runner">
            </div>
          </div>
        </div>
        <div class="status-text" id="statusText">Processing...</div>
        <div class="thank-you-box" id="thankYouBox">
          💖 Thank you for using our tool! Have a wonderful day! 🌸✨
        </div>
      </div>
    </div>

    <div class="output-section" id="outputSection"></div>
  </div>

  <div class="footer">
    Client-Side Fast & Secure Engine • Cyberpunk Edition 🌌
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentMode = 'pdf2jpg'; // Default mode
    let fileQueue = [];
    let processedResults = [];
    let createdPdfBlob = null;

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const dropTitle = document.getElementById('dropTitle');
    const convertBtn = document.getElementById('convertBtn');
    const downloadZipBtn = document.getElementById('downloadZipBtn');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const thankYouBox = document.getElementById('thankYouBox');
    const outputSection = document.getElementById('outputSection');

    function switchMode(mode) {
      currentMode = mode;
      fileQueue = [];
      convertBtn.disabled = true;
      downloadZipBtn.style.display = 'none';
      downloadPdfBtn.style.display = 'none';
      thankYouBox.style.display = 'none';
      progressContainer.style.display = 'none';
      outputSection.innerHTML = '';

      document.getElementById('modePdfToJpgBtn').classList.toggle('active', mode === 'pdf2jpg');
      document.getElementById('modeImgToPdfBtn').classList.toggle('active', mode === 'img2pdf');

      if (mode === 'pdf2jpg') {
        fileInput.accept = "application/pdf";
        dropTitle.innerText = "Drag & Drop your PDFs here";
        convertBtn.innerHTML = "⚡ Convert All PDFs";
      } else {
        fileInput.accept = "image/jpeg, image/jpg, image/png";
        dropTitle.innerText = "Drag & Drop JPG or PNG Images here";
        convertBtn.innerHTML = "⚡ Merge Images to PDF";
      }
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      handleFiles(dt.files);
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    function handleFiles(files) {
      if (currentMode === 'pdf2jpg') {
        fileQueue = Array.from(files).filter(file => file.type === 'application/pdf');
      } else {
        fileQueue = Array.from(files).filter(file => file.type.startsWith('image/'));
      }

      if (fileQueue.length > 0) {
        convertBtn.disabled = false;
        downloadZipBtn.style.display = 'none';
        downloadPdfBtn.style.display = 'none';
        thankYouBox.style.display = 'none';
        updateStatus(`Ready! ${fileQueue.length} file(s) selected.`);
      } else {
        convertBtn.disabled = true;
        updateStatus(`Please select valid files.`);
      }
    }

    function startConversion() {
      if (currentMode === 'pdf2jpg') {
        processPdfToJpg();
      } else {
        processImgToPdf();
      }
    }

    /* === 1. PDF TO JPG LOGIC === */
    async function processPdfToJpg() {
      if (fileQueue.length === 0) return;

      outputSection.innerHTML = '';
      processedResults = [];
      convertBtn.disabled = true;
      downloadZipBtn.style.display = 'none';
      downloadPdfBtn.style.display = 'none';
      thankYouBox.style.display = 'none';
      progressContainer.style.display = 'block';

      let totalPagesAcrossAll = 0;
      let globalPageCounter = 0;

      updateStatus("Analyzing PDF files...");
      const parsedPdfs = [];

      for (let i = 0; i < fileQueue.length; i++) {
        const file = fileQueue[i];
        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          totalPagesAcrossAll += pdfDoc.numPages;
          parsedPdfs.push({ name: file.name, pdfDoc });
        } catch (e) {
          console.error(`Error reading ${file.name}:`, e);
        }
      }

      if (totalPagesAcrossAll === 0) {
        updateStatus("❌ Error reading PDF files.");
        convertBtn.disabled = false;
        return;
      }

      for (let i = 0; i < parsedPdfs.length; i++) {
        const { name, pdfDoc } = parsedPdfs[i];
        
        const fileGroupDiv = document.createElement('div');
        fileGroupDiv.className = 'pdf-group';
        
        const cleanFileName = name.replace(/\.[^/.]+$/, "");
        fileGroupDiv.innerHTML = `
          <div class="pdf-group-header">
            <span>📄 ${name}</span>
            <span style="font-size: 0.9rem; color: #00f2fe;">(${pdfDoc.numPages} Pages)</span>
          </div>
          <div class="grid" id="grid-${i}"></div>
        `;
        outputSection.appendChild(fileGroupDiv);
        const fileGrid = document.getElementById(`grid-${i}`);

        const fileImages = [];

        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
          globalPageCounter++;
          const percent = Math.round((globalPageCounter / totalPagesAcrossAll) * 100);
          
          progressFill.style.width = `${percent}%`;
          updateStatus(`Converting Page ${pageNum}/${pdfDoc.numPages} of "${name}" (${percent}%)`);

          const page = await pdfDoc.getPage(pageNum);
          const scale = 2.0; 
          const viewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;

          const jpgDataUrl = canvas.toDataURL('image/jpeg', 0.92);
          const base64Data = jpgDataUrl.split(',')[1];
          const imgName = `${cleanFileName}_page_${pageNum}.jpg`;

          fileImages.push({ name: imgName, data: base64Data });
          renderSingleCard(fileGrid, jpgDataUrl, pageNum, imgName);
        }

        processedResults.push({
          folderName: cleanFileName,
          images: fileImages
        });
      }

      updateStatus("✨ All PDFs Successfully Converted!");
      thankYouBox.style.display = 'block';
      convertBtn.disabled = false;
      downloadZipBtn.style.display = 'inline-flex';
    }

    /* === 2. JPG/PNG TO PDF LOGIC === */
    async function processImgToPdf() {
      if (fileQueue.length === 0) return;

      outputSection.innerHTML = '';
      convertBtn.disabled = true;
      downloadZipBtn.style.display = 'none';
      downloadPdfBtn.style.display = 'none';
      thankYouBox.style.display = 'none';
      progressContainer.style.display = 'block';

      const { jsPDF } = window.jspdf;
      let pdf = null;

      const fileGroupDiv = document.createElement('div');
      fileGroupDiv.className = 'pdf-group';
      fileGroupDiv.innerHTML = `
        <div class="pdf-group-header">
          <span>🖼️ Images Preview</span>
          <span style="font-size: 0.9rem; color: #00f2fe;">(${fileQueue.length} Images)</span>
        </div>
        <div class="grid" id="imgGrid"></div>
      `;
      outputSection.appendChild(fileGroupDiv);
      const imgGrid = document.getElementById('imgGrid');

      for (let i = 0; i < fileQueue.length; i++) {
        const file = fileQueue[i];
        const percent = Math.round(((i + 1) / fileQueue.length) * 100);
        progressFill.style.width = `${percent}%`;
        updateStatus(`Adding Image ${i + 1}/${fileQueue.length} (${percent}%)`);

        const dataUrl = await readFileAsDataURL(file);
        const imgProps = await getImageProperties(dataUrl);

        const orientation = imgProps.width > imgProps.height ? 'l' : 'p';

        if (i === 0) {
          pdf = new jsPDF({
            orientation: orientation,
            unit: 'px',
            format: [imgProps.width, imgProps.height]
          });
        } else {
          pdf.addPage([imgProps.width, imgProps.height], orientation);
        }

        pdf.addImage(dataUrl, 'JPEG', 0, 0, imgProps.width, imgProps.height);
        renderSingleCard(imgGrid, dataUrl, i + 1, file.name);
      }

      createdPdfBlob = pdf.output('blob');

      updateStatus("✨ Images Successfully Converted to PDF!");
      thankYouBox.style.display = 'block';
      convertBtn.disabled = false;
      downloadPdfBtn.style.display = 'inline-flex';
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function getImageProperties(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          resolve({ width: img.width, height: img.height });
        };
        img.src = dataUrl;
      });
    }

    function renderSingleCard(parentGrid, dataUrl, pageNum, fileName) {
      const card = document.createElement('div');
      card.className = 'page-card';
      card.innerHTML = `
        <img src="${dataUrl}" alt="Item ${pageNum}" loading="lazy">
        <div class="page-info">
          <span># ${pageNum}</span>
          <a href="${dataUrl}" download="${fileName}" class="dl-btn">⬇ Download</a>
        </div>
      `;
      parentGrid.appendChild(card);
    }

    function downloadMasterZip() {
      if (processedResults.length === 0) return;

      updateStatus("📦 Compiling ZIP File...");
      const zip = new JSZip();

      processedResults.forEach(result => {
        const folder = zip.folder(result.folderName);
        result.images.forEach(img => {
          folder.file(img.name, img.data, { base64: true });
        });
      });

      zip.generateAsync({ type: 'blob' }).then(function (content) {
        saveAs(content, 'Converted_PDF_Images.zip');
        updateStatus("✅ Master ZIP Downloaded!");
      }).catch(err => {
        console.error(err);
        updateStatus("❌ Failed to create ZIP.");
      });
    }

    function downloadSinglePdf() {
      if (!createdPdfBlob) return;
      saveAs(createdPdfBlob, 'Converted_Images.pdf');
      updateStatus("✅ PDF Downloaded Successfully!");
    }

    function updateStatus(msg) {
      statusText.textContent = msg;
    }
  </script>
</body>
</html>
