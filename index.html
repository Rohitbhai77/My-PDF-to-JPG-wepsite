<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk File Converter - Pro Suite</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23080c16'/%3E%3Crect x='10' y='15' width='38' height='50' rx='6' fill='%23ff2a75'/%3E%3Ctext x='29' y='45' font-family='sans-serif' font-weight='900' font-size='14' fill='white' text-anchor='middle'%3EPDF%3C/text%3E%3Crect x='52' y='35' width='38' height='50' rx='6' fill='%2300f2fe'/%3E%3Ctext x='71' y='65' font-family='sans-serif' font-weight='900' font-size='14' fill='%23080c16' text-anchor='middle'%3EJPG%3C/text%3E%3Cpath d='M 40 40 L 60 40 L 52 32 M 60 40 L 52 48' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <link rel="manifest" href="manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap');

    :root {
      --neon-pink: #ff2a75;
      --neon-cyan: #00f2fe;
      --btn-gradient: linear-gradient(135deg, #ff007f, #7928ca);
      --btn-success: linear-gradient(135deg, #00b09b, #96c93d);
      --btn-game: linear-gradient(135deg, #ffaa00, #ff0055);
      --glass-bg: rgba(8, 12, 22, 0.45);
      --glass-border: rgba(255, 255, 255, 0.25);
      --text-main: #ffffff;
      --panel-bg: rgba(10, 15, 28, 0.95);
    }

    /* Light Mode Overrides */
    body.light-mode {
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(0, 0, 0, 0.2);
      --text-main: #0f172a;
      --panel-bg: rgba(255, 255, 255, 0.95);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text-main);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
      background: #000;
    }

    /* Fullscreen Video Background */
    .bg-video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: -2;
    }

    .bg-video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.9) contrast(1.05);
      transition: filter 0.8s ease;
    }

    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(90deg, rgba(4, 7, 18, 0.6) 0%, rgba(4, 7, 18, 0.1) 60%, rgba(4, 7, 18, 0) 100%);
      z-index: -1;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    /* Idle Mode Controls */
    .app-wrapper {
      width: 100%;
      max-width: 520px;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
      transform-origin: top left;
    }

    body.idle-mode .app-wrapper,
    body.idle-mode .top-right-controls {
      opacity: 0.05;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* Top-Right Fixed Utility Bar */
    .top-right-controls {
      position: fixed;
      top: 20px;
      right: 25px;
      z-index: 100;
      display: flex;
      gap: 10px;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .nav-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      transform: scale(1.05);
      background: var(--neon-cyan);
      color: #000;
    }

    /* Settings Panel Modal */
    .settings-panel {
      position: absolute;
      top: 45px;
      right: 0;
      width: 220px;
      background: var(--panel-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      display: none;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(12px);
    }

    .settings-panel.active {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .setting-item label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--neon-cyan);
    }

    .setting-item select, .setting-item button {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Compact Top-Left Header */
    .header {
      text-align: left;
      margin-bottom: 10px;
    }

    .animated-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff, #00f2fe, #ff2a75);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowGlow 4s ease infinite;
      filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));
      margin-bottom: 2px;
    }

    @keyframes rainbowGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header p {
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
      background: rgba(0, 0, 0, 0.4);
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
    }

    /* Tabs */
    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .tab-btn.active {
      background: var(--btn-gradient);
      border-color: transparent;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
    }

    .main-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    }

    .drop-zone {
      border: 1.5px dashed rgba(0, 242, 254, 0.8);
      border-radius: 12px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(0, 0, 0, 0.3);
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--neon-pink);
      background: rgba(255, 42, 117, 0.15);
    }

    .drop-zone-icon {
      font-size: 26px;
      margin-bottom: 2px;
      display: inline-block;
    }

    .drop-zone-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .drop-zone-subtitle {
      font-size: 0.75rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    input[type="file"] {
      display: none;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--btn-gradient);
      color: white;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
    }

    .btn-success {
      background: var(--btn-success);
      color: white;
    }

    .btn-game {
      background: var(--btn-game);
      color: white;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none !important;
    }

    .progress-bar-container {
      margin-top: 15px;
      display: none;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 20px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f2fe, #ff2a75);
      border-radius: 20px;
      transition: width 0.2s ease;
    }

    .status-text {
      text-align: left;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #00f2fe;
      font-weight: 800;
    }

    .output-section {
      margin-top: 15px;
      width: 100%;
    }

    .pdf-group {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }

    .page-card {
      background: rgba(10, 15, 28, 0.85);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .page-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .page-info {
      padding: 5px;
      text-align: center;
    }

    .page-info span {
      font-size: 0.7rem;
      color: #ffffff;
      display: block;
      font-weight: 700;
    }

    .dl-btn {
      display: inline-block;
      width: 100%;
      padding: 4px 0;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.3), rgba(255, 42, 117, 0.3));
      color: #ffffff;
      border: 1px solid rgba(0, 242, 254, 0.5);
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 800;
      margin-top: 3px;
    }

    .footer {
      margin-top: 15px;
      color: var(--text-main);
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 12px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <!-- Top Right Utility Bar -->
  <div class="top-right-controls">
    <button class="nav-btn" id="soundBtn" onclick="toggleAudio()">🔊 Sound: OFF</button>
    <button class="nav-btn" onclick="toggleSettingsModal()">⚙️ Settings</button>
    
    <div class="settings-panel" id="settingsPanel">
      <div class="setting-item">
        <label id="lblTheme">Theme Mode</label>
        <button onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
      </div>
      <div class="setting-item">
        <label id="lblLang">Language</label>
        <select id="langSelect" onchange="changeLanguage(this.value)">
          <option value="en">English</option>
          <option value="hi">हिंदी (Hindi)</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </div>
    </div>
  </div>

  <audio id="bgAudio" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>

  <div class="bg-video-container">
    <video autoplay loop muted playsinline id="bgVideo">
      <source src="oggy-bg.mp4" type="video/mp4">
    </video>
  </div>
  <div class="bg-overlay"></div>

  <!-- App Main Wrapper -->
  <div class="app-wrapper">
    <div class="header">
      <h1 class="animated-title" id="appTitle">⚡ File Converter Pro</h1>
      <p id="appSubTitle">Multi-Format Conversion • Ultra HD Quality</p>
    </div>

    <div class="mode-tabs">
      <button class="tab-btn active" id="modePdfToJpgBtn" onclick="switchMode('pdf2jpg')">📄 PDF to JPG</button>
      <button class="tab-btn" id="modeImgToPdfBtn" onclick="switchMode('img2pdf')">🖼️ JPG / PNG to PDF</button>
    </div>

    <div class="main-card">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <span class="drop-zone-icon">🚀</span>
        <div class="drop-zone-title" id="dropTitle">Drag & Drop your PDFs here</div>
        <div class="drop-zone-subtitle" id="dropSub">or click to browse from device</div>
        <input type="file" id="fileInput" accept="application/pdf" multiple />
      </div>

      <div class="controls">
        <button id="convertBtn" class="btn btn-primary" onclick="startConversion()" disabled>
          ⚡ Convert Files
        </button>
        <button id="downloadZipBtn" class="btn btn-success" onclick="downloadMasterZip()" style="display: none;">
          📦 Master ZIP
        </button>
        <button id="downloadPdfBtn" class="btn btn-success" onclick="downloadSinglePdf()" style="display: none;">
          📄 Combined PDF
        </button>
        <a href="GAME.HTML" class="btn btn-game" id="gameBtn">
          🎮 Game
        </a>
      </div>

      <div class="progress-bar-container" id="progressContainer">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-text" id="statusText">Processing...</div>
      </div>
    </div>

    <div class="output-section" id="outputSection"></div>

    <div class="footer" id="footerText">
      Client-Side Fast & Secure Engine • Cyberpunk Edition 🌌
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentMode = 'pdf2jpg';
    let fileQueue = [];
    let processedResults = [];
    let createdPdfBlob = null;
    let isAudioPlaying = false;
    let idleTimer = null;

    // --- Idle Detection Logic (15 Seconds) ---
    function resetIdleTimer() {
      document.body.classList.remove('idle-mode');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        document.body.classList.add('idle-mode');
      }, 15000); // 15s Idle Trigger
    }

    ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
      window.addEventListener(evt, resetIdleTimer, true);
    });
    resetIdleTimer();

    // --- Settings & UI Language Translations ---
    const translations = {
      en: {
        title: "⚡ File Converter Pro",
        sub: "Multi-Format Conversion • Ultra HD Quality",
        dropPdf: "Drag & Drop your PDFs here",
        dropImg: "Drag & Drop JPG or PNG Images here",
        dropSub: "or click to browse from device",
        convert: "⚡ Convert Files",
        game: "🎮 Game",
        lblTheme: "Theme Mode",
        lblLang: "Language"
      },
      hi: {
        title: "⚡ फ़ाइल कनवर्टर प्रो",
        sub: "मल्टी-फॉर्मेट परिवर्तन • अल्ट्रा एचडी गुणवत्ता",
        dropPdf: "अपनी PDF फ़ाइलें यहाँ खींचें और छोड़ें",
        dropImg: "JPG या PNG चित्र यहाँ खींचें और छोड़ें",
        dropSub: "या अपने डिवाइस से चुनने के लिए क्लिक करें",
        convert: "⚡ फ़ाइलें बदलें",
        game: "🎮 गेम खेलें",
        lblTheme: "थीम मोड",
        lblLang: "भाषा"
      },
      es: {
        title: "⚡ Convertidor Pro",
        sub: "Conversión multiformato • Calidad Ultra HD",
        dropPdf: "Arrastra y suelta tus archivos PDF aquí",
        dropImg: "Arrastra y suelta imágenes JPG o PNG aquí",
        dropSub: "o haz clic para buscar desde tu dispositivo",
        convert: "⚡ Convertir Archivos",
        game: "🎮 Juego",
        lblTheme: "Modo de Tema",
        lblLang: "Idioma"
      },
      fr: {
        title: "⚡ Convertisseur Pro",
        sub: "Conversion multi-format • Qualité Ultra HD",
        dropPdf: "Glissez & déposez vos PDF ici",
        dropImg: "Glissez & déposez des images JPG ou PNG ici",
        dropSub: "ou cliquez pour parcourir l'appareil",
        convert: "⚡ Convertir les Fichiers",
        game: "🎮 Jeu",
        lblTheme: "Thème",
        lblLang: "Langue"
      }
    };

    function toggleSettingsModal() {
      const panel = document.getElementById('settingsPanel');
      panel.classList.toggle('active');
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('themeBtn').innerText = isLight ? "☀️ Light Mode" : "🌙 Dark Mode";
    }

    function changeLanguage(lang) {
      const t = translations[lang] || translations.en;
      document.getElementById('appTitle').innerText = t.title;
      document.getElementById('appSubTitle').innerText = t.sub;
      document.getElementById('dropSub').innerText = t.dropSub;
      document.getElementById('convertBtn').innerText = t.convert;
      document.getElementById('gameBtn').innerText = t.game;
      document.getElementById('lblTheme').innerText = t.lblTheme;
      document.getElementById('lblLang').innerText = t.lblLang;

      if (currentMode === 'pdf2jpg') {
        document.getElementById('dropTitle').innerText = t.dropPdf;
      } else {
        document.getElementById('dropTitle').innerText = t.dropImg;
      }
    }

    // Audio Control
    const soundBtn = document.getElementById('soundBtn');
    const bgAudio = document.getElementById('bgAudio');

    function toggleAudio() {
      if (isAudioPlaying) {
        bgAudio.pause();
        soundBtn.innerHTML = "🔊 Sound: OFF";
        isAudioPlaying = false;
      } else {
        bgAudio.play().then(() => {
          soundBtn.innerHTML = "🎶 Sound: ON";
          isAudioPlaying = true;
        }).catch(err => console.log(err));
      }
    }

    // --- Main Converter Logic ---
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const dropTitle = document.getElementById('dropTitle');
    const convertBtn = document.getElementById('convertBtn');
    const downloadZipBtn = document.getElementById('downloadZipBtn');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const outputSection = document.getElementById('outputSection');

    function switchMode(mode) {
      currentMode = mode;
      fileQueue = [];
      convertBtn.disabled = true;
      downloadZipBtn.style.display = 'none';
      downloadPdfBtn.style.display = 'none';
      progressContainer.style.display = 'none';
      outputSection.innerHTML = '';

      document.getElementById('modePdfToJpgBtn').classList.toggle('active', mode === 'pdf2jpg');
      document.getElementById('modeImgToPdfBtn').classList.toggle('active', mode === 'img2pdf');

      const currentLang = document.getElementById('langSelect').value;
      const t = translations[currentLang] || translations.en;

      if (mode === 'pdf2jpg') {
        fileInput.accept = "application/pdf";
        dropTitle.innerText = t.dropPdf;
      } else {
        fileInput.accept = "image/jpeg, image/jpg, image/png";
        dropTitle.innerText = t.dropImg;
      }
    }

    ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.remove('dragover'); }));

    dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      fileQueue = currentMode === 'pdf2jpg' 
        ? Array.from(files).filter(f => f.type === 'application/pdf')
        : Array.from(files).filter(f => f.type.startsWith('image/'));

      if (fileQueue.length > 0) {
        convertBtn.disabled = false;
        updateStatus(`Ready! ${fileQueue.length} file(s) selected.`);
      } else {
        convertBtn.disabled = true;
        updateStatus(`Select valid files.`);
      }
    }

    function startConversion() {
      if (currentMode === 'pdf2jpg') processPdfToJpg();
      else processImgToPdf();
    }

    function loadPdfWithPassword(arrayBuffer, fileName) {
      return new Promise((resolve, reject) => {
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        loadingTask.onPassword = (updatePassword) => {
          const pass = prompt(`🔑 "${fileName}" is password protected. Enter password:`);
          if (pass) updatePassword(pass);
          else reject(new Error("CANCELLED"));
        };
        loadingTask.promise.then(resolve).catch(reject);
      });
    }

    async function processPdfToJpg() {
      if (!fileQueue.length) return;
      outputSection.innerHTML = '';
      processedResults = [];
      convertBtn.disabled = true;
      progressContainer.style.display = 'block';

      let totalPages = 0, globalCounter = 0, parsedPdfs = [];

      for (let file of fileQueue) {
        try {
          const buffer = await file.arrayBuffer();
          const pdfDoc = await loadPdfWithPassword(buffer, file.name);
          totalPages += pdfDoc.numPages;
          parsedPdfs.push({ name: file.name, pdfDoc });
        } catch (e) {
          alert(`Skipped or invalid file: ${file.name}`);
        }
      }

      if (!totalPages) { convertBtn.disabled = false; return; }

      for (let i = 0; i < parsedPdfs.length; i++) {
        const { name, pdfDoc } = parsedPdfs[i];
        const cleanName = name.replace(/\.[^/.]+$/, "");
        
        const groupDiv = document.createElement('div');
        groupDiv.className = 'pdf-group';
        groupDiv.innerHTML = `<div style="font-size:0.85rem;font-weight:800;margin-bottom:8px;">📄 ${name} (${pdfDoc.numPages} Pages)</div><div class="grid" id="grid-${i}"></div>`;
        outputSection.appendChild(groupDiv);
        const grid = document.getElementById(`grid-${i}`);

        const fileImages = [];
        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
          globalCounter++;
          const percent = Math.round((globalCounter / totalPages) * 100);
          progressFill.style.width = `${percent}%`;
          updateStatus(`Converting Page ${pageNum}/${pdfDoc.numPages}`);

          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: ctx, viewport }).promise;
          const jpgData = canvas.toDataURL('image/jpeg', 0.9);
          const imgName = `${cleanName}_page_${pageNum}.jpg`;

          fileImages.push({ name: imgName, data: jpgData.split(',')[1] });
          renderCard(grid, jpgData, pageNum, imgName);
        }
        processedResults.push({ folderName: cleanName, images: fileImages });
      }

      updateStatus("✨ Conversion Completed!");
      convertBtn.disabled = false;
      downloadZipBtn.style.display = 'inline-flex';
    }

    async function processImgToPdf() {
      if (!fileQueue.length) return;
      outputSection.innerHTML = '';
      convertBtn.disabled = true;
      progressContainer.style.display = 'block';

      const { jsPDF } = window.jspdf;
      let pdf = null;

      const groupDiv = document.createElement('div');
      groupDiv.className = 'pdf-group';
      groupDiv.innerHTML = `<div class="grid" id="imgGrid"></div>`;
      outputSection.appendChild(groupDiv);
      const grid = document.getElementById('imgGrid');

      for (let i = 0; i < fileQueue.length; i++) {
        const file = fileQueue[i];
        const percent = Math.round(((i + 1) / fileQueue.length) * 100);
        progressFill.style.width = `${percent}%`;
        updateStatus(`Adding Image ${i + 1}/${fileQueue.length}`);

        const dataUrl = await readFileDataUrl(file);
        const imgProps = await getImageProps(dataUrl);
        const orientation = imgProps.width > imgProps.height ? 'l' : 'p';

        if (i === 0) pdf = new jsPDF({ orientation, unit: 'px', format: [imgProps.width, imgProps.height] });
        else pdf.addPage([imgProps.width, imgProps.height], orientation);

        pdf.addImage(dataUrl, 'JPEG', 0, 0, imgProps.width, imgProps.height);
        renderCard(grid, dataUrl, i + 1, file.name);
      }

      createdPdfBlob = pdf.output('blob');
      updateStatus("✨ PDF Created!");
      convertBtn.disabled = false;
      downloadPdfBtn.style.display = 'inline-flex';
    }

    function readFileDataUrl(file) {
      return new Promise((res) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.readAsDataURL(file);
      });
    }

    function getImageProps(url) {
      return new Promise((res) => {
        const img = new Image();
        img.onload = () => res({ width: img.width, height: img.height });
        img.src = url;
      });
    }

    function renderCard(grid, dataUrl, num, name) {
      const card = document.createElement('div');
      card.className = 'page-card';
      card.innerHTML = `
        <img src="${dataUrl}" loading="lazy">
        <div class="page-info">
          <span>#${num}</span>
          <a href="${dataUrl}" download="${name}" class="dl-btn">⬇ Download</a>
        </div>`;
      grid.appendChild(card);
    }

    function downloadMasterZip() {
      const zip = new JSZip();
      processedResults.forEach(res => {
        const folder = zip.folder(res.folderName);
        res.images.forEach(img => folder.file(img.name, img.data, { base64: true }));
      });
      zip.generateAsync({ type: 'blob' }).then(content => saveAs(content, 'Converted_Images.zip'));
    }

    function downloadSinglePdf() {
      if (createdPdfBlob) saveAs(createdPdfBlob, 'Converted_Document.pdf');
    }

    function updateStatus(msg) { statusText.textContent = msg; }
  </script>
</body>
</html>
