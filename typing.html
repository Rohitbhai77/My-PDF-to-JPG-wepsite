<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypePro Ultra — Monkeytype-Grade Typing Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Noto+Sans+Devanagari:wght@400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --text-dim: #334155;
      
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #38bdf8;
      
      --char-correct: #10b981;
      --char-wrong: #ef4444;
      --char-wrong-bg: rgba(239, 68, 68, 0.2);
      
      --font-mono: 'JetBrains Mono', monospace;
      --font-hindi: 'Noto Sans Devanagari', sans-serif;
      --font-main: 'Outfit', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Navbar Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 800;
      font-size: 1.4rem;
    }

    .brand-logo {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .user-xp-badge {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      font-size: 0.9rem;
    }

    .xp-level { color: var(--accent); font-weight: 700; }

    /* Control Bar */
    .config-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      background: var(--card-bg);
      padding: 0.8rem 1.2rem;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .btn-group {
      display: flex;
      gap: 0.3rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.25rem;
      border-radius: 10px;
    }

    .cfg-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cfg-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* Live HUD Bar */
    .hud-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .hud-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      text-align: center;
    }

    .hud-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
    .hud-val { font-size: 1.75rem; font-family: var(--font-mono); font-weight: 700; margin-top: 0.2rem; }

    /* Monkeytype 3-Line Typing Window */
    .typing-viewport {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.5rem;
      position: relative;
      cursor: text;
      min-height: 150px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .word-stream {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      line-height: 2.2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6em;
      color: var(--text-muted);
      user-select: none;
      width: 100%;
    }

    .word-stream.hindi { font-family: var(--font-hindi); font-size: 1.6rem; }

    .word { display: flex; position: relative; }
    .char { transition: color 0.1s, background 0.1s; }
    .char.correct { color: var(--char-correct); }
    .char.wrong { color: var(--char-wrong); background: var(--char-wrong-bg); border-radius: 2px; }
    .char.active { color: var(--text-main); position: relative; }
    .char.active::before {
      content: ''; position: absolute; left: 0; bottom: -2px; width: 100%; height: 3px;
      background: var(--accent); border-radius: 2px; animation: blink 1s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Visual On-Screen Keyboard */
    .keyboard-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      align-items: center;
    }

    .kb-row { display: flex; gap: 0.35rem; }

    .key {
      min-width: 38px;
      height: 38px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .key.wide-1 { min-width: 55px; }
    .key.wide-2 { min-width: 75px; }
    .key.space { min-width: 250px; }

    .key.target-key {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      transform: translateY(-2px);
    }

    .key.pressed-correct { background: rgba(16, 185, 129, 0.3) !important; color: white !important; }
    .key.pressed-wrong { background: rgba(239, 68, 68, 0.4) !important; color: white !important; }

    .finger-guide-text {
      text-align: center;
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 0.3rem;
      font-weight: 600;
    }

    /* Result Dashboard View */
    .results-dashboard {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.75rem;
      flex-direction: column;
      gap: 1.5rem;
    }

    .results-dashboard.active { display: flex; }

    .res-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
    }

    .ai-review-card {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid var(--primary);
      border-radius: 14px;
      padding: 1.25rem;
    }

    .ai-review-card h3 { color: var(--accent); margin-bottom: 0.5rem; }

    .weak-keys-list {
      display: flex; gap: 0.5rem; margin-top: 0.5rem;
    }
    .weak-key-tag {
      background: rgba(239, 68, 68, 0.2);
      color: var(--char-wrong);
      border: 1px solid var(--char-wrong);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .hidden-input { position: absolute; opacity: 0; pointer-events: none; }

    .btn-action {
      background: var(--primary);
      color: white; border: none; padding: 0.65rem 1.4rem;
      font-weight: 700; border-radius: 10px; cursor: pointer;
      align-self: center; transition: all 0.2s;
    }
    .btn-action:hover { transform: translateY(-2px); box-shadow: 0 4px 15px var(--primary-glow); }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">T</div>
      <span>TypePro Ultra</span>
    </div>
    <div class="user-xp-badge">
      <span>Level <strong id="userLevel" class="xp-level">1</strong></span>
      <span style="color: var(--text-muted)">|</span>
      <span>XP: <strong id="userXP" style="color:var(--text-main)">0</strong></span>
    </div>
  </header>

  <!-- Controls -->
  <section class="config-toolbar">
    <div class="btn-group" id="langSelect">
      <button class="cfg-btn active" data-lang="en">🇬🇧 English</button>
      <button class="cfg-btn" data-lang="hi">🇮🇳 Hindi</button>
    </div>

    <div class="btn-group" id="topicSelect">
      <button class="cfg-btn active" data-topic="easy">Easy</button>
      <button class="cfg-btn" data-topic="medium">Medium</button>
      <button class="cfg-btn" data-topic="hard">Hard</button>
      <button class="cfg-btn" data-topic="code">Code</button>
      <button class="cfg-btn" data-topic="science">Science</button>
    </div>

    <div class="btn-group" id="timeSelect">
      <button class="cfg-btn active" data-time="30">30s</button>
      <button class="cfg-btn" data-time="60">1m</button>
      <button class="cfg-btn" data-time="120">2m</button>
      <button class="cfg-btn" data-time="300">5m</button>
    </div>
  </section>

  <!-- Main Test View -->
  <main id="testContainer" style="display:flex; flex-direction:column; gap:1.25rem;">
    <div class="hud-grid">
      <div class="hud-card">
        <div class="hud-title">Timer</div>
        <div class="hud-val" id="hudTimer">30s</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Speed</div>
        <div class="hud-val" id="hudWpm">0 <span style="font-size:0.9rem; color:var(--text-muted)">WPM</span></div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Accuracy</div>
        <div class="hud-val" id="hudAcc">100%</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">Mistakes</div>
        <div class="hud-val" id="hudMistakes">0</div>
      </div>
    </div>

    <div class="typing-viewport" id="viewport">
      <div class="word-stream" id="wordStream"></div>
      <input type="text" class="hidden-input" id="typingInput" autocomplete="off" spellcheck="false" />
    </div>

    <!-- Onscreen Interactive Keyboard -->
    <div class="keyboard-panel" id="virtualKeyboard">
      <div class="kb-row" id="row1"></div>
      <div class="kb-row" id="row2"></div>
      <div class="kb-row" id="row3"></div>
      <div class="kb-row" id="row4"></div>
      <div class="finger-guide-text" id="fingerGuide">Finger Recommendation: Ready</div>
    </div>

    <button class="btn-action" id="resetBtn">🔄 Reset Test (Esc)</button>
  </main>

  <!-- Results View -->
  <section class="results-dashboard" id="resultContainer">
    <h2>🏆 Test Completed!</h2>
    
    <div class="res-grid">
      <div class="hud-card"><div class="hud-title">WPM</div><div class="hud-val" id="resWpm">0</div></div>
      <div class="hud-card"><div class="hud-title">CPM</div><div class="hud-val" id="resCpm">0</div></div>
      <div class="hud-card"><div class="hud-title">Accuracy</div><div class="hud-val" id="resAcc">0%</div></div>
      <div class="hud-card"><div class="hud-title">Mistakes</div><div class="hud-val" id="resMistakes">0</div></div>
      <div class="hud-card"><div class="hud-title">XP Gained</div><div class="hud-val" id="resXp" style="color:var(--accent)">+0</div></div>
    </div>

    <div class="ai-review-card">
      <h3>🤖 Diagnostic Feedback</h3>
      <p id="aiReviewMsg">Analyzing performance...</p>
      <div style="margin-top: 0.8rem;">
        <span style="font-size:0.85rem; color:var(--text-muted);">Weakest Keys to Practice:</span>
        <div class="weak-keys-list" id="weakKeysContainer"></div>
      </div>
    </div>

    <button class="btn-action" id="tryAgainBtn">🔄 Try Another Test</button>
  </section>
</div>

<script>
/* ==========================================================================
   MEGA WORD CORPUS & PROCEDURAL TEXT ALGORITHM
   ========================================================================== */
const CORPUS = {
  en: {
    easy: ["the", "be", "of", "and", "a", "to", "in", "he", "have", "it", "that", "for", "they", "with", "as", "not", "on", "she", "at", "by", "this", "we", "you", "do", "but", "from", "or", "which", "one", "would", "all", "will", "there", "say", "who", "make", "when", "can", "more", "if", "no", "man", "out", "other", "so", "what", "time", "up", "go", "about", "than", "into", "could", "state", "only", "new", "year", "some", "take", "come", "these", "know", "see", "use", "get", "like", "then", "first", "any", "work", "now", "may", "such", "give", "over", "think", "most", "even", "find", "day", "also", "after", "way", "many", "must", "look", "before", "great", "back", "through", "long", "where", "much", "should", "well", "people", "down", "own", "just", "because", "good", "each", "those", "feel", "seem", "how", "high", "too", "place", "little", "world", "very", "still", "nation", "hand", "old", "life", "tell", "write", "become", "here", "show", "house", "both", "between", "need", "mean", "call", "develop", "under", "last", "right", "move", "thing", "general", "school", "never", "same", "another", "begin", "while", "number", "part", "turn", "real", "leave", "might", "want", "point", "form", "off", "child", "few", "small", "since", "against", "ask", "late", "home", "interest", "large", "person", "end", "open", "public", "follow", "during", "present", "without", "again", "hold", "govern", "around", "possible", "head", "consider", "word", "program", "problem", "however", "lead", "system", "set", "order", "eye", "plan", "run", "keep", "face", "fact", "group", "play", "stand", "increase", "early", "course", "change", "help", "line"],
    medium: ["algorithm", "architecture", "asynchronous", "benchmark", "bandwidth", "compilation", "concurrency", "dataflow", "efficiency", "encapsulation", "framework", "functionality", "inheritance", "interaction", "interface", "iteration", "middleware", "optimization", "parameter", "polymorphism", "precision", "refactoring", "repository", "scalability", "synchronization", "throughput", "validation", "versatility", "vulnerability"],
    hard: ["extraordinary", "misunderstanding", "unquestionably", "incomprehensible", "counterproductive", "disproportionate", "notwithstanding", "disestablishmentarianism", "characterization", "enthusiastically"],
    code: ["const", "function", "return", "let", "async", "await", "import", "export", "class", "extends", "constructor", "document.getElementById", "addEventListener", "console.log", "process.env", "Promise.resolve"],
    science: ["photosynthesis", "thermodynamics", "quantum", "mitochondria", "gravity", "electromagnetism", "astronomy", "neuroscience", "chromosome", "velocity"]
  },
  hi: {
    easy: ["राम", "घर", "जाता", "है", "भारत", "एक", "महान", "देश", "है", "समय", "का", "सही", "उपयोग", "करो", "सच्चाई", "की", "जीत", "होती", "है", "हमें", "रोज़", "अभ्यास", "करना", "चाहिए", "ज्ञान", "ही", "सबसे", "बड़ा", "धन", "है"],
    medium: ["तकनीक", "और", "विज्ञान", "ने", "मानव", "जीवन", "को", "अत्यंत", "सरल", "और", "सुगम", "बना", "दिया", "है", "निरंतर", "प्रयास", "से", "ही", "सफलता", "प्राप्त", "होती", "है"],
    hard: ["आत्मनिर्भरता", "सहानुभूति", "उत्तरदायित्व", "प्रौद्योगिकी", "विश्वसनीयता", "सकारात्मकता"]
  }
};

const KEYBOARD_LAYOUT = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["z","x","c","v","b","n","m"],
  ["space"]
];

const FINGER_MAP = {
  'q':'Left Pinky','a':'Left Pinky','z':'Left Pinky',
  'w':'Left Ring','s':'Left Ring','x':'Left Ring',
  'e':'Left Middle','d':'Left Middle','c':'Left Middle',
  'r':'Left Index','f':'Left Index','v':'Left Index','t':'Left Index','g':'Left Index','b':'Left Index',
  'y':'Right Index','h':'Right Index','n':'Right Index','u':'Right Index','j':'Right Index','m':'Right Index',
  'i':'Right Middle','k':'Right Middle',
  'o':'Right Ring','l':'Right Ring',
  'p':'Right Pinky','space':'Thumbs'
};

/* ==========================================================================
   APP STATE
   ========================================================================== */
const state = {
  lang: 'en',
  topic: 'easy',
  timeLimit: 30,
  timeLeft: 30,
  
  generatedWords: [],
  currentWordIdx: 0,
  currentCharIdx: 0,
  
  correctChars: 0,
  wrongChars: 0,
  totalMistakes: 0,
  wrongKeyMap: {},
  
  isStarted: false,
  timerInterval: null,
  
  xp: parseInt(localStorage.getItem('typepro_xp') || '0'),
  level: parseInt(localStorage.getItem('typepro_level') || '1')
};

/* ==========================================================================
   DOM ELEMENTS
   ========================================================================== */
const els = {
  wordStream: document.getElementById('wordStream'),
  typingInput: document.getElementById('typingInput'),
  viewport: document.getElementById('viewport'),
  hudTimer: document.getElementById('hudTimer'),
  hudWpm: document.getElementById('hudWpm'),
  hudAcc: document.getElementById('hudAcc'),
  hudMistakes: document.getElementById('hudMistakes'),
  userXP: document.getElementById('userXP'),
  userLevel: document.getElementById('userLevel'),
  fingerGuide: document.getElementById('fingerGuide'),
  testContainer: document.getElementById('testContainer'),
  resultContainer: document.getElementById('resultContainer'),
  resWpm: document.getElementById('resWpm'),
  resCpm: document.getElementById('resCpm'),
  resAcc: document.getElementById('resAcc'),
  resMistakes: document.getElementById('resMistakes'),
  resXp: document.getElementById('resXp'),
  aiReviewMsg: document.getElementById('aiReviewMsg'),
  weakKeysContainer: document.getElementById('weakKeysContainer'),
  resetBtn: document.getElementById('resetBtn'),
  tryAgainBtn: document.getElementById('tryAgainBtn')
};

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
function init() {
  buildKeyboard();
  setupConfigListeners();
  updateUserStatsUI();
  resetTest();

  els.viewport.addEventListener('click', () => els.typingInput.focus());
  els.typingInput.addEventListener('input', handleTyping);
  els.resetBtn.addEventListener('click', resetTest);
  els.tryAgainBtn.addEventListener('click', () => {
    els.resultContainer.classList.remove('active');
    els.testContainer.style.display = 'flex';
    resetTest();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') resetTest();
  });
}

function updateUserStatsUI() {
  els.userXP.textContent = state.xp;
  els.userLevel.textContent = state.level;
}

/* Build Virtual Keyboard UI */
function buildKeyboard() {
  const kb = document.getElementById('virtualKeyboard');
  const rows = [document.getElementById('row1'), document.getElementById('row2'), document.getElementById('row3'), document.getElementById('row4')];
  rows.forEach(r => r.innerHTML = '');

  KEYBOARD_LAYOUT.forEach((rowKeys, rowIdx) => {
    rowKeys.forEach(k => {
      const keyEl = document.createElement('div');
      keyEl.className = `key ${k === 'space' ? 'space' : ''}`;
      keyEl.id = `key-${k}`;
      keyEl.textContent = k === 'space' ? 'Space' : k.toUpperCase();
      rows[rowIdx].appendChild(keyEl);
    });
  });
}

/* Algorithmic Paragraph Builder */
function generateProceduralText() {
  const targetWords = Math.round((state.timeLimit / 30) * 60) + 20; // 30s=80w, 60s=140w etc.
  const pool = CORPUS[state.lang][state.topic] || CORPUS.en.easy;
  
  let words = [];
  for (let i = 0; i < targetWords; i++) {
    words.push(pool[Math.floor(Math.random() * pool.length)]);
  }
  state.generatedWords = words;
}

/* Render Stream */
function renderWords() {
  els.wordStream.innerHTML = '';
  els.wordStream.className = `word-stream ${state.lang === 'hi' ? 'hindi' : ''}`;

  state.generatedWords.forEach((w, wIdx) => {
    const wordSpan = document.createElement('span');
    wordSpan.className = 'word';
    wordSpan.id = `w-${wIdx}`;

    Array.from(w).forEach((c, cIdx) => {
      const charSpan = document.createElement('span');
      charSpan.className = 'char';
      charSpan.id = `c-${wIdx}-${cIdx}`;
      charSpan.textContent = c;
      wordSpan.appendChild(charSpan);
    });

    els.wordStream.appendChild(wordSpan);
  });

  highlightCurrentPosition();
}

function highlightCurrentPosition() {
  document.querySelectorAll('.char').forEach(c => c.classList.remove('active'));
  const curChar = document.getElementById(`c-${state.currentWordIdx}-${state.currentCharIdx}`);
  
  if (curChar) {
    curChar.classList.add('active');
    updateFingerGuide(curChar.textContent.toLowerCase());
  } else {
    // End of word (space required)
    updateFingerGuide('space');
  }
}

function updateFingerGuide(char) {
  document.querySelectorAll('.key').forEach(k => k.classList.remove('target-key'));
  const finger = FINGER_MAP[char] || 'Thumbs';
  els.fingerGuide.textContent = `Finger Recommendation: ${finger}`;

  const targetKey = document.getElementById(`key-${char}`);
  if (targetKey) targetKey.classList.add('target-key');
}

/* ==========================================================================
   TYPING LOGIC ENGINE
   ========================================================================== */
function handleTyping(e) {
  if (!state.isStarted) startTest();

  const val = els.typingInput.value;
  const currentWord = state.generatedWords[state.currentWordIdx];

  if (val.endsWith(' ')) {
    // Word submit
    const typedWord = val.trim();
    if (typedWord === currentWord) {
      state.correctChars += currentWord.length + 1;
    } else {
      state.wrongChars += Math.abs(currentWord.length - typedWord.length);
      state.totalMistakes++;
    }

    state.currentWordIdx++;
    state.currentCharIdx = 0;
    els.typingInput.value = '';
  } else {
    state.currentCharIdx = val.length;
    const charEl = document.getElementById(`c-${state.currentWordIdx}-${val.length - 1}`);

    if (charEl) {
      const targetChar = currentWord[val.length - 1];
      const typedChar = val[val.length - 1];

      if (typedChar === targetChar) {
        charEl.className = 'char correct';
        state.correctChars++;
        flashKey(typedChar, true);
      } else {
        charEl.className = 'char wrong';
        state.wrongChars++;
        state.totalMistakes++;
        state.wrongKeyMap[targetChar] = (state.wrongKeyMap[targetChar] || 0) + 1;
        flashKey(typedChar || targetChar, false);
      }
    }
  }

  updateHUD();
  highlightCurrentPosition();
}

function flashKey(char, isCorrect) {
  const kEl = document.getElementById(`key-${char.toLowerCase()}`);
  if (kEl) {
    kEl.classList.add(isCorrect ? 'pressed-correct' : 'pressed-wrong');
    setTimeout(() => kEl.classList.remove('pressed-correct', 'pressed-wrong'), 150);
  }
}

function updateHUD() {
  const elapsed = (state.timeLimit - state.timeLeft) || 1;
  const mins = elapsed / 60;
  const wpm = Math.round((state.correctChars / 5) / mins);
  const total = state.correctChars + state.wrongChars;
  const acc = total > 0 ? Math.round((state.correctChars / total) * 100) : 100;

  els.hudWpm.innerHTML = `${wpm} <span style="font-size:0.9rem; color:var(--text-muted)">WPM</span>`;
  els.hudAcc.textContent = `${acc}%`;
  els.hudMistakes.textContent = state.totalMistakes;
}

function startTest() {
  state.isStarted = true;
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    els.hudTimer.textContent = `${state.timeLeft}s`;
    updateHUD();

    if (state.timeLeft <= 0) finishTest();
  }, 1000);
}

function finishTest() {
  clearInterval(state.timerInterval);
  els.testContainer.style.display = 'none';
  els.resultContainer.classList.add('active');

  const elapsed = state.timeLimit / 60;
  const wpm = Math.round((state.correctChars / 5) / elapsed);
  const cpm = Math.round(state.correctChars / elapsed);
  const total = state.correctChars + state.wrongChars;
  const acc = total > 0 ? Math.round((state.correctChars / total) * 100) : 100;

  // XP calculation
  const gainedXP = Math.round(wpm * (acc / 100) + 20);
  state.xp += gainedXP;
  if (state.xp >= state.level * 100) state.level++;

  localStorage.setItem('typepro_xp', state.xp);
  localStorage.setItem('typepro_level', state.level);
  updateUserStatsUI();

  els.resWpm.textContent = wpm;
  els.resCpm.textContent = cpm;
  els.resAcc.textContent = `${acc}%`;
  els.resMistakes.textContent = state.totalMistakes;
  els.resXp.textContent = `+${gainedXP} XP`;

  // Diagnostic feedback
  els.aiReviewMsg.textContent = acc > 90 ? "Excellent accuracy & rhythm! Keep pushing your speed limits." : "Good attempt! Focus on key accuracy first before increasing speed.";

  // Render weak keys
  els.weakKeysContainer.innerHTML = '';
  const sortedWeakKeys = Object.keys(state.wrongKeyMap).sort((a,b) => state.wrongKeyMap[b] - state.wrongKeyMap[a]).slice(0, 3);
  
  if (sortedWeakKeys.length === 0) {
    els.weakKeysContainer.innerHTML = '<span style="color:var(--char-correct)">None! Perfect execution.</span>';
  } else {
    sortedWeakKeys.forEach(k => {
      const tag = document.createElement('span');
      tag.className = 'weak-key-tag';
      tag.textContent = `${k.toUpperCase()} (${state.wrongKeyMap[k]})`;
      els.weakKeysContainer.appendChild(tag);
    });
  }
}

function resetTest() {
  clearInterval(state.timerInterval);
  state.isStarted = false;
  state.timeLeft = state.timeLimit;
  state.currentWordIdx = 0;
  state.currentCharIdx = 0;
  state.correctChars = 0;
  state.wrongChars = 0;
  state.totalMistakes = 0;
  state.wrongKeyMap = {};

  els.hudTimer.textContent = `${state.timeLimit}s`;
  els.hudWpm.innerHTML = `0 <span style="font-size:0.9rem; color:var(--text-muted)">WPM</span>`;
  els.hudAcc.textContent = '100%';
  els.hudMistakes.textContent = '0';
  els.typingInput.value = '';

  generateProceduralText();
  renderWords();
  els.typingInput.focus();
}

function setupConfigListeners() {
  document.querySelectorAll('.btn-group').forEach(grp => {
    grp.addEventListener('click', (e) => {
      const btn = e.target.closest('.cfg-btn');
      if (!btn) return;

      grp.querySelectorAll('.cfg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (btn.dataset.lang) state.lang = btn.dataset.lang;
      if (btn.dataset.topic) state.topic = btn.dataset.topic;
      if (btn.dataset.time) state.timeLimit = parseInt(btn.dataset.time);

      resetTest();
    });
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
