<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TypePro Ultra — Precision Speed Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Rozha+One&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ===== MODERN CYBER-AMBER THEME ===== */
      --bg-base: #0f141c;
      --bg-surface: #151c27;
      --bg-card: rgba(22, 30, 44, 0.75);
      --bg-card-solid: #161e2c;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(234, 179, 8, 0.4);

      /* Typography colors */
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --text-inactive: #475569;

      /* Accents */
      --accent: #eab308;
      --accent-hover: #facc15;
      --accent-glow: rgba(234, 179, 8, 0.25);
      --primary: #38bdf8;

      /* Typing States */
      --char-correct: #e2e8f0;
      --char-wrong: #f43f5e;
      --char-wrong-bg: rgba(244, 63, 94, 0.22);
      --caret-color: #eab308;

      /* Typography */
      --font-mono: 'Fira Code', monospace;
      --font-ui: 'Plus Jakarta Sans', sans-serif;
      --font-devanagari: 'Noto Sans Devanagari', sans-serif;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(234, 179, 8, 0.08), transparent 70%),
        radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.04), transparent 50%);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(0.75rem, 3vw, 2rem);
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea { font-family: inherit; }

    .app-shell {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Modern Minimalist Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 0.9rem 1.4rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent), #f97316);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 800;
      color: #000;
      font-size: 1.25rem;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .stats-pill {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Configuration Panel */
    .config-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.6rem 0.9rem;
    }

    .btn-cluster {
      display: inline-flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.25rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      overflow-x: auto;
      max-width: 100%;
    }

    .btn-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-item:hover { color: var(--text-main); }
    .btn-item.active {
      background: var(--accent);
      color: #0b1120;
      font-weight: 700;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* HUD Metrics Display */
    .hud-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.1rem;
      text-align: center;
      position: relative;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .stat-number {
      font-family: var(--font-mono);
      font-size: clamp(1.6rem, 3.5vw, 2.3rem);
      font-weight: 700;
      margin-top: 0.2rem;
      color: var(--text-main);
    }

    /* Enhanced Typing Viewport with Larger Font */
    .typing-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: clamp(1.4rem, 4vw, 2.5rem);
      position: relative;
      cursor: text;
      height: 200px;
      overflow-y: hidden;
      box-shadow: inset 0 2px 14px rgba(0, 0, 0, 0.4);
    }

    .text-stream {
      font-family: var(--font-mono);
      font-size: clamp(1.5rem, 2.5vw, 1.85rem);
      line-height: 2.7rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75em;
      color: var(--text-inactive);
      user-select: none;
      transition: transform 0.2s ease-out;
    }

    .text-stream.devanagari {
      font-family: var(--font-devanagari);
      font-size: clamp(1.6rem, 2.8vw, 2rem);
      line-height: 3rem;
    }

    .word { display: inline-flex; position: relative; }
    .char {
      transition: color 0.06s;
      border-radius: 4px;
    }

    .char.correct { color: var(--char-correct); }
    .char.wrong {
      color: var(--char-wrong);
      background: var(--char-wrong-bg);
      text-decoration: underline;
    }

    .char.active {
      color: #fff;
      position: relative;
    }

    .char.active::before {
      content: '';
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 3.5px;
      background: var(--caret-color);
      border-radius: 2px;
      animation: pulseCaret 1.1s ease-in-out infinite;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    @keyframes pulseCaret {
      0%, 100% { opacity: 1; transform: scaleY(1); }
      50% { opacity: 0.2; transform: scaleY(0.7); }
    }

    /* Virtual Keyboard Visualizer */
    .keyboard-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      align-items: center;
      overflow-x: auto;
    }

    .keyboard-row {
      display: flex;
      gap: 0.35rem;
    }

    .key-cap {
      min-width: 44px;
      height: 42px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .key-cap.space-bar { min-width: clamp(160px, 30vw, 280px); }
    
    .key-cap.target {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      transform: translateY(-2px);
    }

    .key-cap.hit-ok {
      background: rgba(234, 179, 8, 0.25) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
      transform: translateY(2px);
    }

    .key-cap.hit-err {
      background: rgba(244, 63, 94, 0.4) !important;
      border-color: var(--char-wrong) !important;
      color: #fff !important;
      transform: translateY(2px);
    }

    .finger-indicator {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 0.35rem;
    }

    .hidden-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .btn-action {
      background: var(--accent);
      color: #0b1120;
      border: none;
      padding: 0.75rem 1.8rem;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
      background: var(--accent-hover);
    }

    /* Result Dashboard */
    .summary-view {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: clamp(1.2rem, 3vw, 2.5rem);
      flex-direction: column;
      gap: 1.5rem;
    }
    .summary-view.active { display: flex; }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.85rem;
    }

    .chart-panel {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.25rem;
    }

    .chart-panel svg {
      width: 100%;
      height: 120px;
    }

    /* Custom Text Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 14, 0.8);
      backdrop-filter: blur(10px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--bg-card-solid);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .modal-card textarea {
      width: 100%;
      height: 150px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: #fff;
      padding: 0.9rem;
      font-size: 1rem;
      font-family: var(--font-mono);
      outline: none;
      resize: vertical;
    }

    .modal-card textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Fully Responsive Layout Rules */
    @media (max-width: 800px) {
      .hud-row { grid-template-columns: repeat(2, 1fr); }
      .config-strip { flex-direction: column; }
      .btn-cluster { width: 100%; }
      .btn-item { flex: 1; text-align: center; }
      .key-cap { min-width: 32px; height: 36px; font-size: 0.75rem; }
      .typing-box { height: 180px; }
    }

    @media (max-width: 480px) {
      .keyboard-container { display: none; } /* Focus mode on smaller phones */
      .brand-title { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <header>
    <div class="brand-group">
      <div class="logo-badge">⚡</div>
      <div class="brand-title">TypePro Ultra</div>
    </div>
    <div class="stats-pill">
      <span>Rank Lvl <strong id="userLevel" style="color:var(--accent)">1</strong></span>
      <span style="opacity:0.3">•</span>
      <span>XP: <strong id="userXP">0</strong></span>
    </div>
  </header>

  <nav class="config-strip">
    <div class="btn-cluster" id="langSelect">
      <button class="btn-item active" data-lang="en">English</button>
      <button class="btn-item" data-lang="hi">हिंदी (Devanagari)</button>
    </div>

    <div class="btn-cluster" id="topicSelect">
      <button class="btn-item active" data-topic="easy">Easy</button>
      <button class="btn-item" data-topic="medium">Medium</button>
      <button class="btn-item" data-topic="hard">Hard</button>
      <button class="btn-item" data-topic="code">Code</button>
      <button class="btn-item" data-topic="science">Science</button>
      <button class="btn-item" data-topic="custom" id="customTopicBtn">Custom ✏️</button>
    </div>

    <div class="btn-cluster" id="timeSelect">
      <button class="btn-item active" data-time="30">30s</button>
      <button class="btn-item" data-time="60">60s</button>
      <button class="btn-item" data-time="120">2m</button>
    </div>
  </nav>

  <section id="typingArena" style="display:flex; flex-direction:column; gap:1.25rem;">
    <div class="hud-row">
      <div class="stat-box">
        <div class="stat-label">Remaining Time</div>
        <div class="stat-number" id="hudTimer">30s</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Real-Time WPM</div>
        <div class="stat-number" id="hudWpm">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Accuracy</div>
        <div class="stat-number" id="hudAcc">100%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Errors</div>
        <div class="stat-number" id="hudMistakes">0</div>
      </div>
    </div>

    <div class="typing-box" id="viewport">
      <div class="text-stream" id="wordStream"></div>
      <input type="text" class="hidden-input" id="typingInput" autocomplete="off" spellcheck="false" />
    </div>

    <div class="keyboard-container" id="virtualKeyboard">
      <div class="keyboard-row" id="row1"></div>
      <div class="keyboard-row" id="row2"></div>
      <div class="keyboard-row" id="row3"></div>
      <div class="keyboard-row" id="row4"></div>
      <div class="finger-indicator" id="fingerGuide">Finger Recommendation: Ready</div>
    </div>

    <button class="btn-action" id="resetBtn">↻ Restart Session (Esc)</button>
  </section>

  <!-- Summary Window -->
  <section class="summary-view" id="resultContainer">
    <h2 style="font-size:1.4rem;">🏁 Session Statistics</h2>
    
    <div class="result-grid">
      <div class="stat-box"><div class="stat-label">Net WPM</div><div class="stat-number" id="resWpm">0</div></div>
      <div class="stat-box"><div class="stat-label">Raw WPM</div><div class="stat-number" id="resRawWpm">0</div></div>
      <div class="stat-box"><div class="stat-label">Accuracy</div><div class="stat-number" id="resAcc">0%</div></div>
      <div class="stat-box"><div class="stat-label">Mistakes</div><div class="stat-number" id="resMistakes">0</div></div>
      <div class="stat-box"><div class="stat-label">Consistency</div><div class="stat-number" id="resConsistency">0%</div></div>
      <div class="stat-box"><div class="stat-label">XP Acquired</div><div class="stat-number" id="resXp" style="color:var(--accent)">+0</div></div>
    </div>

    <div class="chart-panel">
      <div class="stat-label" style="margin-bottom:0.75rem;">WPM Performance Curve</div>
      <svg id="wpmGraphSvg" viewBox="0 0 500 120"></svg>
    </div>

    <button class="btn-action" id="tryAgainBtn">Try Again</button>
  </section>
</div>

<!-- Custom Text Modal -->
<div class="modal-overlay" id="customModal">
  <div class="modal-card">
    <h3>Custom Practice Text</h3>
    <p style="font-size: 0.85rem; color: var(--text-muted);">Paste your text or code block below:</p>
    <textarea id="customTextInput" placeholder="Type or paste custom paragraph here..."></textarea>
    <div style="display:flex; justify-content:flex-end; gap:0.75rem;">
      <button class="btn-item" id="cancelCustomBtn" style="padding:0.6rem 1.2rem; background: rgba(255,255,255,0.06);">Cancel</button>
      <button class="btn-action" id="applyCustomBtn" style="padding:0.6rem 1.4rem;">Save & Apply</button>
    </div>
  </div>
</div>

<script>
const CORPUS = {
  en: {
    easy: [
      "the quick brown fox jumps over the lazy dog",
      "typing is a fundamental skill that sharpens with focused practice",
      "keep your hands relaxed and maintain a consistent natural flow",
      "accuracy always comes before raw speed in professional typing"
    ],
    medium: [
      "efficient algorithms minimize compute overhead across distributed clusters",
      "modern web frameworks deliver exceptional responsive rendering performance",
      "asynchronous architectures decouple complex processes without blocking the main event loop"
    ],
    hard: [
      "unquestionably characterization demands meticulous precision and synchronization",
      "disproportionate vulnerabilities counterproductively compromise cryptographic benchmarks",
      "extraordinary misunderstandings disproportionately hinder architectural collaboration"
    ],
    code: [
      "const data = await fetch('/api/metrics').then(res => res.json());",
      "export default function calculateVelocity({ words, minutes }) {",
      "return list.filter(item => item.isActive).map(item => item.val);"
    ],
    science: [
      "cellular respiration converts biochemical energy from nutrients into adenosine triphosphate",
      "gravitational redshift occurs as photons escape from massive relativistic bodies",
      "quantum entanglement demonstrates instantaneous correlation between paired physical states"
    ]
  },
  hi: {
    easy: [
      "समय का सही सदुपयोग ही मनुष्य को सफलता के शिखर पर ले जाता है",
      "नियमित अभ्यास करने से किसी भी कार्य में दक्षता प्राप्त हो सकती है",
      "सकारात्मक सोच और एकाग्रता हमारे आत्मविश्वास को निरंतर बढ़ाती है"
    ],
    medium: [
      "आधुनिक सूचना प्रौद्योगिकी ने संवाद और शिक्षा के आयाम पूरी तरह बदल दिए हैं",
      "वैज्ञानिक अनुसंधानों ने हमारे दैनिक जीवन को अधिक सहज एवं गतिशील बना दिया है"
    ],
    hard: [
      "प्रौद्योगिकी का संतुलित उपयोग ही सामाजिक और नैतिक संतुलन को सुदृढ़ आधार प्रदान करता है",
      "दृढ़ संकल्प और निरंतर उत्तरदायित्व से ही किसी राष्ट्र की सामूहिक प्रगति संभव होती है"
    ]
  }
};

const KEYBOARD_LAYOUT = [
  ["q","w","e","r","t","y","u","i","o","p"],
  ["a","s","d","f","g","h","j","k","l"],
  ["z","x","c","v","b","n","m"],
  ["space"]
];

const FINGER_MAP = {
  'q':'Left Pinky','a':'Left Pinky','z':'Left Pinky',
  'w':'Left Ring','s':'Left Ring','x':'Left Ring',
  'e':'Left Middle','d':'Left Middle','c':'Left Middle',
  'r':'Left Index','f':'Left Index','v':'Left Index','t':'Left Index','g':'Left Index','b':'Left Index',
  'y':'Right Index','h':'Right Index','n':'Right Index','u':'Right Index','j':'Right Index','m':'Right Index',
  'i':'Right Middle','k':'Right Middle',
  'o':'Right Ring','l':'Right Ring',
  'p':'Right Pinky','space':'Thumbs'
};

const state = {
  lang: 'en',
  topic: 'easy',
  timeLimit: 30,
  timeLeft: 30,
  words: [],
  currentWordIdx: 0,
  customText: localStorage.getItem('typepro_custom_text') || "",
  totalKeystrokes: 0,
  correctChars: 0,
  totalErrors: 0,
  wpmTimeline: [],
  isStarted: false,
  timerInterval: null,
  xp: parseInt(localStorage.getItem('typepro_xp') || '0'),
  level: parseInt(localStorage.getItem('typepro_level') || '1')
};

const els = {
  wordStream: document.getElementById('wordStream'),
  typingInput: document.getElementById('typingInput'),
  viewport: document.getElementById('viewport'),
  hudTimer: document.getElementById('hudTimer'),
  hudWpm: document.getElementById('hudWpm'),
  hudAcc: document.getElementById('hudAcc'),
  hudMistakes: document.getElementById('hudMistakes'),
  userXP: document.getElementById('userXP'),
  userLevel: document.getElementById('userLevel'),
  fingerGuide: document.getElementById('fingerGuide'),
  typingArena: document.getElementById('typingArena'),
  resultContainer: document.getElementById('resultContainer'),
  resWpm: document.getElementById('resWpm'),
  resRawWpm: document.getElementById('resRawWpm'),
  resAcc: document.getElementById('resAcc'),
  resMistakes: document.getElementById('resMistakes'),
  resConsistency: document.getElementById('resConsistency'),
  resXp: document.getElementById('resXp'),
  wpmGraphSvg: document.getElementById('wpmGraphSvg'),
  resetBtn: document.getElementById('resetBtn'),
  tryAgainBtn: document.getElementById('tryAgainBtn'),
  customModal: document.getElementById('customModal'),
  customTextInput: document.getElementById('customTextInput'),
  applyCustomBtn: document.getElementById('applyCustomBtn'),
  cancelCustomBtn: document.getElementById('cancelCustomBtn'),
  customTopicBtn: document.getElementById('customTopicBtn')
};

function init() {
  buildKeyboard();
  bindConfigOptions();
  bindCustomModal();
  updateUserStatsUI();
  resetTest();

  els.viewport.addEventListener('click', () => els.typingInput.focus());
  els.typingInput.addEventListener('keydown', handleKeyDown);
  els.resetBtn.addEventListener('click', resetTest);
  els.tryAgainBtn.addEventListener('click', () => {
    els.resultContainer.classList.remove('active');
    els.typingArena.style.display = 'flex';
    resetTest();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !els.customModal.classList.contains('active')) resetTest();
  });
}

function updateUserStatsUI() {
  els.userXP.textContent = state.xp;
  els.userLevel.textContent = state.level;
}

function buildKeyboard() {
  const rows = [document.getElementById('row1'), document.getElementById('row2'), document.getElementById('row3'), document.getElementById('row4')];
  rows.forEach(r => r.innerHTML = '');

  KEYBOARD_LAYOUT.forEach((rowKeys, rowIdx) => {
    rowKeys.forEach(k => {
      const keyEl = document.createElement('div');
      keyEl.className = `key-cap ${k === 'space' ? 'space-bar' : ''}`;
      keyEl.id = `key-${k}`;
      keyEl.textContent = k === 'space' ? 'Space' : k.toUpperCase();
      rows[rowIdx].appendChild(keyEl);
    });
  });
}

function generateProceduralText() {
  if (state.topic === 'custom' && state.customText.trim()) {
    parseWords(state.customText.trim());
    return;
  }

  const pool = (CORPUS[state.lang] && CORPUS[state.lang][state.topic]) || CORPUS.en.easy;
  let text = "";
  while (text.split(' ').length < 120) {
    const pick = pool[Math.floor(Math.random() * pool.length)];
    text += (text ? " " : "") + pick;
  }
  parseWords(text);
}

function parseWords(raw) {
  const clean = raw.replace(/\s+/g, ' ').trim();
  state.words = clean.split(' ').map(w => ({
    chars: Array.from(w),
    typed: ""
  }));
}

function renderWords() {
  els.wordStream.innerHTML = '';
  els.wordStream.className = `text-stream ${state.lang === 'hi' ? 'devanagari' : ''}`;

  state.words.forEach((wObj, wIdx) => {
    const wordSpan = document.createElement('span');
    wordSpan.className = 'word';
    wordSpan.id = `w-${wIdx}`;

    wObj.chars.forEach((c, cIdx) => {
      const charSpan = document.createElement('span');
      charSpan.className = 'char';
      charSpan.id = `c-${wIdx}-${cIdx}`;
      charSpan.textContent = c;
      wordSpan.appendChild(charSpan);
    });

    els.wordStream.appendChild(wordSpan);
  });

  updateCaret();
}

function updateCaret() {
  document.querySelectorAll('.char').forEach(c => c.classList.remove('active'));
  const currentWord = state.words[state.currentWordIdx];
  if (!currentWord) return;

  const charIdx = currentWord.typed.length;
  if (charIdx < currentWord.chars.length) {
    const curCharEl = document.getElementById(`c-${state.currentWordIdx}-${charIdx}`);
    if (curCharEl) curCharEl.classList.add('active');
    updateFingerGuide(currentWord.chars[charIdx].toLowerCase());
  } else {
    updateFingerGuide('space');
  }

  // Smooth scroll
  const wordEl = document.getElementById(`w-${state.currentWordIdx}`);
  if (wordEl) {
    const viewportTop = els.viewport.getBoundingClientRect().top;
    const wordTop = wordEl.getBoundingClientRect().top;
    const offset = wordTop - viewportTop;
    if (offset > 80) els.viewport.scrollTop += (offset - 50);
  }
}

function updateFingerGuide(char) {
  document.querySelectorAll('.key-cap').forEach(k => k.classList.remove('target'));
  const finger = FINGER_MAP[char] || 'Thumbs';
  els.fingerGuide.textContent = `Next Key: [ ${char === 'space' ? 'SPACE' : char.toUpperCase()} ] • ${finger}`;

  const targetKey = document.getElementById(`key-${char}`);
  if (targetKey) targetKey.classList.add('target');
}

function handleKeyDown(e) {
  if (e.key === 'Escape') return;
  if (!state.isStarted) startTest();

  const currentWord = state.words[state.currentWordIdx];
  if (!currentWord) return;

  if (e.key === 'Backspace') {
    e.preventDefault();
    if (currentWord.typed.length > 0) {
      const removeIdx = currentWord.typed.length - 1;
      currentWord.typed = currentWord.typed.slice(0, -1);
      const charEl = document.getElementById(`c-${state.currentWordIdx}-${removeIdx}`);
      if (charEl) charEl.className = 'char';
      updateCaret();
    } else if (state.currentWordIdx > 0) {
      state.currentWordIdx--;
      updateCaret();
    }
    return;
  }

  if (e.key === ' ') {
    e.preventDefault();
    if (currentWord.typed.length === 0) return;

    state.totalKeystrokes++;
    flashKey('space', true);

    let wordCorrect = true;
    currentWord.chars.forEach((c, idx) => {
      if (currentWord.typed[idx] === c) {
        state.correctChars++;
      } else {
        wordCorrect = false;
      }
    });

    if (currentWord.typed.length === currentWord.chars.length && wordCorrect) {
      state.correctChars++;
    } else {
      state.totalErrors++;
    }

    state.currentWordIdx++;
    els.typingInput.value = '';

    if (state.currentWordIdx >= state.words.length) {
      finishTest();
      return;
    }

    updateHUD();
    updateCaret();
    return;
  }

  if (e.key.length === 1) {
    e.preventDefault();
    const typedChar = e.key;
    const charIndex = currentWord.typed.length;
    currentWord.typed += typedChar;
    state.totalKeystrokes++;

    const expectedChar = currentWord.chars[charIndex];
    const charEl = document.getElementById(`c-${state.currentWordIdx}-${charIndex}`);

    if (charEl) {
      if (typedChar === expectedChar) {
        charEl.className = 'char correct';
        flashKey(typedChar, true);
      } else {
        charEl.className = 'char wrong';
        state.totalErrors++;
        flashKey(typedChar, false);
      }
    }

    updateHUD();
    updateCaret();
  }
}

function flashKey(char, isCorrect) {
  const el = document.getElementById(`key-${char.toLowerCase()}`);
  if (el) {
    el.classList.add(isCorrect ? 'hit-ok' : 'hit-err');
    setTimeout(() => el.classList.remove('hit-ok', 'hit-err'), 140);
  }
}

function updateHUD() {
  const elapsed = Math.max(1, state.timeLimit - state.timeLeft);
  const minutes = elapsed / 60;
  const netWpm = Math.max(0, Math.round((state.correctChars / 5) / minutes));
  const accuracy = state.totalKeystrokes > 0 
    ? Math.max(0, Math.round(((state.totalKeystrokes - state.totalErrors) / state.totalKeystrokes) * 100))
    : 100;

  els.hudWpm.textContent = netWpm;
  els.hudAcc.textContent = `${accuracy}%`;
  els.hudMistakes.textContent = state.totalErrors;
}

function startTest() {
  state.isStarted = true;
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    els.hudTimer.textContent = `${state.timeLeft}s`;

    const elapsed = state.timeLimit - state.timeLeft;
    const currentWpm = Math.round((state.correctChars / 5) / (elapsed / 60));
    state.wpmTimeline.push({ time: elapsed, wpm: currentWpm });

    updateHUD();
    if (state.timeLeft <= 0) finishTest();
  }, 1000);
}

function finishTest() {
  clearInterval(state.timerInterval);
  els.typingArena.style.display = 'none';
  els.resultContainer.classList.add('active');

  const elapsed = Math.max(1, state.timeLimit - state.timeLeft);
  const minutes = elapsed / 60;
  const netWpm = Math.max(0, Math.round((state.correctChars / 5) / minutes));
  const rawWpm = Math.max(0, Math.round((state.totalKeystrokes / 5) / minutes));
  const accuracy = state.totalKeystrokes > 0 
    ? Math.max(0, Math.round(((state.totalKeystrokes - state.totalErrors) / state.totalKeystrokes) * 100))
    : 100;

  const wpms = state.wpmTimeline.map(t => t.wpm);
  const avgWpm = wpms.reduce((a, b) => a + b, 0) / (wpms.length || 1);
  const variance = wpms.reduce((a, b) => a + Math.pow(b - avgWpm, 2), 0) / (wpms.length || 1);
  const consistency = Math.max(50, Math.min(100, Math.round(100 - Math.sqrt(variance))));

  const gainedXP = Math.round(netWpm * (accuracy / 100) + 25);
  state.xp += gainedXP;
  while (state.xp >= state.level * 120) {
    state.xp -= (state.level * 120);
    state.level++;
  }

  localStorage.setItem('typepro_xp', state.xp);
  localStorage.setItem('typepro_level', state.level);
  updateUserStatsUI();

  els.resWpm.textContent = netWpm;
  els.resRawWpm.textContent = rawWpm;
  els.resAcc.textContent = `${accuracy}%`;
  els.resMistakes.textContent = state.totalErrors;
  els.resConsistency.textContent = `${consistency}%`;
  els.resXp.textContent = `+${gainedXP} XP`;

  renderChart(state.wpmTimeline);
}

function renderChart(data) {
  if (!data.length) return;
  const maxWpm = Math.max(...data.map(d => d.wpm), 60);
  const points = data.map((d, i) => {
    const x = (i / (data.length - 1 || 1)) * 480 + 10;
    const y = 110 - ((d.wpm / maxWpm) * 95);
    return `${x},${y}`;
  }).join(' ');

  els.wpmGraphSvg.innerHTML = `
    <polyline fill="none" stroke="rgba(234, 179, 8, 0.2)" stroke-width="4" points="${points}" />
    <polyline fill="none" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" points="${points}" />
  `;
}

function resetTest() {
  clearInterval(state.timerInterval);
  state.isStarted = false;
  state.timeLeft = state.timeLimit;
  state.currentWordIdx = 0;
  state.totalKeystrokes = 0;
  state.correctChars = 0;
  state.totalErrors = 0;
  state.wpmTimeline = [];

  els.hudTimer.textContent = `${state.timeLimit}s`;
  els.hudWpm.textContent = '0';
  els.hudAcc.textContent = '100%';
  els.hudMistakes.textContent = '0';
  els.typingInput.value = '';
  els.viewport.scrollTop = 0;

  generateProceduralText();
  renderWords();
  els.typingInput.focus();
}

function bindConfigOptions() {
  document.querySelectorAll('.btn-cluster').forEach(grp => {
    grp.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-item');
      if (!btn) return;

      if (btn.dataset.topic === 'custom') {
        els.customTextInput.value = state.customText;
        els.customModal.classList.add('active');
        els.customTextInput.focus();
        return;
      }

      grp.querySelectorAll('.btn-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (btn.dataset.lang) state.lang = btn.dataset.lang;
      if (btn.dataset.topic) state.topic = btn.dataset.topic;
      if (btn.dataset.time) state.timeLimit = parseInt(btn.dataset.time);

      resetTest();
    });
  });
}

function bindCustomModal() {
  els.cancelCustomBtn.addEventListener('click', () => {
    els.customModal.classList.remove('active');
    els.typingInput.focus();
  });

  els.applyCustomBtn.addEventListener('click', () => {
    const text = els.customTextInput.value.trim();
    if (!text) return;

    state.customText = text;
    localStorage.setItem('typepro_custom_text', text);
    state.topic = 'custom';

    document.querySelectorAll('#topicSelect .btn-item').forEach(b => b.classList.remove('active'));
    els.customTopicBtn.classList.add('active');

    els.customModal.classList.remove('active');
    resetTest();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
